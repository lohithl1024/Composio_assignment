<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dataset | Integration Radar</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14191f;
        --muted: #647181;
        --line: #d8e0e8;
        --paper: #f6f3ee;
        --panel: #ffffff;
        --dark: #071014;
        --dark-2: #101a22;
        --teal: #00a88f;
        --blue: #3b82f6;
        --amber: #d97706;
        --red: #dc2626;
        --green: #16a34a;
        --violet: #7c3aed;
        --radius: 8px;
        --shadow: 0 22px 70px rgba(9, 16, 24, 0.12);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, #071014 0, #071014 560px, var(--paper) 560px),
          var(--paper);
        line-height: 1.5;
      }

      a { color: inherit; text-decoration: none; }
      a:hover { text-decoration: underline; }

      .site-nav {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(7, 16, 20, 0.76);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(18px);
      }

      .nav-inner {
        max-width: 1220px;
        margin: 0 auto;
        min-height: 62px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        padding: 0 24px;
        color: #f8fafc;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 850;
        letter-spacing: 0;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background: linear-gradient(135deg, var(--teal), var(--blue));
        box-shadow: 0 0 34px rgba(0, 168, 143, 0.42);
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .nav-links a {
        padding: 8px 10px;
        border-radius: 999px;
        color: rgba(248, 250, 252, 0.78);
        font-size: 13px;
        font-weight: 700;
      }

      .nav-links a.active,
      .nav-links a:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.1);
        text-decoration: none;
      }

      .page {
        max-width: 1220px;
        margin: 0 auto;
        padding: 34px 24px 76px;
      }

      .hero {
        min-height: 520px;
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(340px, 0.92fr);
        gap: 34px;
        align-items: center;
        color: #f8fafc;
      }

      .eyebrow {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        color: #99f6e4;
        font-size: 12px;
        font-weight: 850;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--teal);
        box-shadow: 0 0 20px var(--teal);
      }

      h1, h2, h3, p { margin-top: 0; }
      h1 {
        margin-bottom: 18px;
        font-size: clamp(48px, 7vw, 88px);
        line-height: 0.94;
        letter-spacing: 0;
      }

      h2 {
        margin-bottom: 12px;
        font-size: clamp(30px, 4vw, 48px);
        line-height: 1;
        letter-spacing: 0;
      }

      h3 { margin-bottom: 8px; font-size: 18px; line-height: 1.18; }

      .hero-copy {
        max-width: 820px;
        color: rgba(248, 250, 252, 0.76);
        font-size: 18px;
      }

      .hero-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 26px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 15px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.08);
        color: #f8fafc;
        font-weight: 800;
        font-size: 14px;
      }

      .button.primary {
        border-color: transparent;
        background: linear-gradient(135deg, var(--teal), var(--blue));
        color: #ffffff;
      }

      .scorecard {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        background:
          radial-gradient(circle at top right, rgba(0, 168, 143, 0.24), transparent 38%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04));
        box-shadow: 0 22px 80px rgba(0, 0, 0, 0.34);
        padding: 22px;
      }

      .scorecard-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .live-pill {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 10px;
        border: 1px solid rgba(153, 246, 228, 0.34);
        border-radius: 999px;
        color: #99f6e4;
        font-size: 12px;
        font-weight: 800;
      }

      .score-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .score {
        min-height: 118px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        background: rgba(7, 16, 20, 0.42);
        padding: 14px;
      }

      .score strong {
        display: block;
        color: #ffffff;
        font-size: 34px;
        line-height: 1;
      }

      .score span {
        display: block;
        margin-top: 8px;
        color: rgba(248, 250, 252, 0.68);
        font-size: 13px;
      }

      .audit-strip {
        margin-top: 14px;
        padding: 14px;
        border-radius: 14px;
        background: rgba(0, 168, 143, 0.1);
        color: rgba(248, 250, 252, 0.78);
        font-size: 13px;
      }

      .section {
        margin-top: 28px;
        padding: 42px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.76);
        box-shadow: var(--shadow);
      }

      .section.plain {
        padding: 42px 0;
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: end;
        margin-bottom: 24px;
      }

      .section-head p {
        max-width: 680px;
        color: var(--muted);
      }

      .muted { color: var(--muted); }

      .editorial-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
        gap: 22px;
      }

      .finding-list {
        display: grid;
        gap: 16px;
      }

      .finding {
        padding-left: 18px;
        border-left: 4px solid var(--teal);
      }

      .finding p { color: var(--muted); margin-bottom: 0; }

      .ops-board {
        border-radius: 16px;
        background: var(--dark);
        color: #f8fafc;
        padding: 22px;
      }

      .ops-item {
        display: grid;
        grid-template-columns: 30px 1fr;
        gap: 12px;
        padding: 14px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .ops-item:first-of-type { border-top: 0; }
      .num {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(0, 168, 143, 0.14);
        color: #99f6e4;
        font-weight: 850;
      }

      .landscape {
        position: relative;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .quadrant {
        min-height: 240px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        padding: 18px;
        display: grid;
        align-content: space-between;
      }

      .quadrant.good { border-color: rgba(22, 163, 74, 0.32); }
      .quadrant.admin { border-color: rgba(59, 130, 246, 0.34); }
      .quadrant.gated { border-color: rgba(217, 119, 6, 0.42); }
      .quadrant.review { border-color: rgba(220, 38, 38, 0.34); }

      .quadrant-count {
        font-size: 44px;
        line-height: 1;
        font-weight: 900;
      }

      .chip-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      .chip, .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .chip { background: #edf2f7; color: #334155; }
      .badge.green { background: #dcfce7; color: #166534; }
      .badge.blue { background: #dbeafe; color: #1d4ed8; }
      .badge.amber { background: #fef3c7; color: #92400e; }
      .badge.red { background: #fee2e2; color: #991b1b; }
      .badge.gray { background: #e5e7eb; color: #374151; }
      .badge.dark { background: #111827; color: #f9fafb; }

      .timeline {
        display: grid;
        grid-template-columns: repeat(6, minmax(160px, 1fr));
        gap: 12px;
        overflow: auto;
        padding-bottom: 8px;
      }

      .stage {
        min-height: 190px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        padding: 16px;
      }

      .stage code, .agent code, .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      .stage code {
        display: inline-block;
        margin-top: 10px;
        color: var(--teal);
        font-size: 12px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .metric {
        min-height: 132px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        padding: 18px;
      }

      .metric strong {
        display: block;
        font-size: 34px;
        line-height: 1;
      }

      .metric span {
        display: block;
        margin-top: 9px;
        color: var(--muted);
        font-size: 13px;
      }

      .chart-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .chart {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        padding: 18px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 175px 1fr 54px;
        gap: 10px;
        align-items: center;
        margin-top: 12px;
        font-size: 13px;
      }

      .bar-track {
        height: 10px;
        border-radius: 999px;
        background: #e8edf3;
        overflow: hidden;
      }

      .bar { height: 100%; border-radius: 999px; background: var(--teal); }
      .bar.blue { background: var(--blue); }
      .bar.amber { background: var(--amber); }
      .bar.red { background: var(--red); }
      .bar.violet { background: var(--violet); }

      .queue-grid, .agent-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .queue, .agent {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        padding: 18px;
      }

      .queue-list, .agent-list {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .queue-row {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 12px;
        align-items: start;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }

      .queue-row:first-child { border-top: 0; padding-top: 0; }

      .rank {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #e6f4f1;
        color: var(--teal);
        font-weight: 900;
        font-size: 13px;
      }

      .agent {
        background:
          linear-gradient(180deg, rgba(255,255,255,0.94), rgba(255,255,255,0.8)),
          radial-gradient(circle at top right, rgba(0,168,143,0.12), transparent 42%);
      }

      .agent-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: start;
      }

      .code {
        display: block;
        margin-top: 14px;
        padding: 14px;
        border-radius: 12px;
        background: #0b1117;
        color: #d1fae5;
        white-space: pre-wrap;
        overflow: auto;
        font-size: 12px;
      }

      .table-shell {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        overflow: hidden;
      }

      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        padding: 14px;
        border-bottom: 1px solid var(--line);
        background: #fbfcfe;
      }

      input, select {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        padding: 0 12px;
        font: inherit;
      }

      input { min-width: 280px; flex: 1; }

      .table-wrap { overflow: auto; max-height: 760px; }
      table { width: 100%; min-width: 1180px; border-collapse: collapse; }
      th, td {
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
        font-size: 13px;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: #f8fafc;
        color: #334155;
        font-size: 12px;
        text-transform: uppercase;
      }

      .proof-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 18px;
      }

      .footer {
        color: rgba(248,250,252,0.62);
        background: var(--dark);
        padding: 28px 24px;
        margin-top: 40px;
        text-align: center;
        font-size: 13px;
      }

      @media (max-width: 980px) {
        body { background: linear-gradient(180deg, #071014 0, #071014 720px, var(--paper) 720px), var(--paper); }
        .hero, .editorial-grid, .queue-grid, .agent-grid, .proof-grid, .chart-grid { grid-template-columns: 1fr; }
        .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .timeline { grid-template-columns: repeat(6, 220px); }
      }

      @media (max-width: 640px) {
        .nav-inner, .page { padding-left: 14px; padding-right: 14px; }
        .nav-inner { align-items: flex-start; flex-direction: column; padding-top: 12px; padding-bottom: 12px; }
        .section { padding: 24px 16px; }
        .score-grid, .metric-grid, .landscape { grid-template-columns: 1fr; }
        .bar-row { grid-template-columns: 110px 1fr 42px; }
        input { min-width: 100%; }
      }
    </style>
  </head>

    <script>
      const PAGE = "dataset";
      const BASE = "../";
      const analysis = JSON.parse(document.querySelector("#analysis-data").textContent);
      const rows = JSON.parse(document.querySelector("#table-data").textContent);
      const verification = JSON.parse(document.querySelector("#verification-data").textContent);
      const app = document.querySelector("#app");

      const countOf = (dist, key) => dist?.[key]?.count || 0;
      const pctOf = (dist, key) => dist?.[key]?.pct || 0;
      const fmtPct = (value) => `${Number(value || 0).toFixed(1)}%`;
      const titleize = (value) => String(value || "unclear").replaceAll("_", " ");
      const link = (path) => `${BASE}${path}`;

      function badgeClass(value) {
        if (["buildable_now", "high", "pass", "none", "yes", "self_serve_free_or_trial"].includes(value)) return "green";
        if (["buildable_with_caveats", "medium", "partial", "admin_or_workspace_dependent"].includes(value)) return "blue";
        if (["possible_but_gated", "self_serve_paid_plan_required", "flagged", "corrected"].includes(value)) return "amber";
        if (["not_practical_today", "low", "unclear", "unclear_needs_review", "partner_or_contact_sales_gated"].includes(value)) return "red";
        return "gray";
      }

      function hero({ eyebrow, title, copy, primary, secondary }) {
        return `
          <section class="hero">
            <div>
              <div class="eyebrow">${eyebrow}</div>
              <h1>${title}</h1>
              <p class="hero-copy">${copy}</p>
              <div class="hero-actions">
                ${primary ? `<a class="button primary" href="${primary.href}">${primary.label}</a>` : ""}
                ${secondary ? `<a class="button" href="${secondary.href}">${secondary.label}</a>` : ""}
              </div>
            </div>
            ${scorecard()}
          </section>
        `;
      }

      function scorecard() {
        const ds = analysis.dataset_summary;
        const build = analysis.buildability_distribution;
        const reviewCount = countOf(build, "possible_but_gated") + countOf(build, "unclear_needs_review");
        return `
          <aside class="scorecard">
            <div class="scorecard-head">
              <div><strong>Radar scorecard</strong><div class="muted">Generated from verified records</div></div>
              <span class="live-pill">100-app run</span>
            </div>
            <div class="score-grid">
              <div class="score"><strong>${ds.total_apps}</strong><span>apps researched</span></div>
              <div class="score"><strong>${countOf(build, "buildable_now")}</strong><span>buildable now</span></div>
              <div class="score"><strong>${countOf(build, "buildable_with_caveats")}</strong><span>build with caveats</span></div>
              <div class="score"><strong>${reviewCount}</strong><span>gated / needs review</span></div>
              <div class="score"><strong>${ds.with_evidence}</strong><span>rows with evidence</span></div>
              <div class="score"><strong>${verification.sample_size}</strong><span>sampled audit apps</span></div>
            </div>
            <div class="audit-strip">
              <strong>${fmtPct(verification.first_pass_accuracy * 100)} strict</strong> ·
              <strong>${fmtPct(verification.first_pass_correct_or_partial_rate * 100)} correct-or-partial</strong>.
              Conservative verifier; unresolved rows stayed visible.
            </div>
          </aside>
        `;
      }

      function metric(value, label) {
        return `<div class="metric"><strong>${value}</strong><span>${label}</span></div>`;
      }

      function chart(title, distribution, color = "") {
        const entries = Object.entries(distribution || {}).slice(0, 8);
        const max = Math.max(...entries.map(([, stats]) => stats.count), 1);
        return `<div class="chart"><h3>${title}</h3>${entries.map(([label, stats]) => `
          <div class="bar-row"><span>${titleize(label)}</span><div class="bar-track"><div class="bar ${color}" style="width:${(stats.count / max) * 100}%"></div></div><strong>${stats.count}</strong></div>
        `).join("")}</div>`;
      }

      function overviewPage() {
        app.innerHTML = `
          ${hero({
            eyebrow: "Composio take-home · Integration Radar",
            title: "A 100-app map of toolkit readiness.",
            copy: "I built an agentic research pipeline that classifies requested apps by auth, access friction, API surface, MCP evidence, and buildability, then audits the result to separate automation-ready findings from rows that still need human review.",
            primary: { href: link("dataset/"), label: "Explore dataset" },
            secondary: { href: link("agents/"), label: "See agent architecture" }
          })}
          <section class="section plain">
            <div class="editorial-grid">
              <div>
                <div class="eyebrow" style="color: var(--teal)">What matters</div>
                <h2>The research is useful because it becomes a roadmap filter.</h2>
                <div class="finding-list">${analysis.headline_findings.slice(0, 5).map((finding) => `<div class="finding"><h3>${finding.split(",")[0]}</h3><p>${finding}</p></div>`).join("")}</div>
              </div>
              <aside class="ops-board">
                <h3>What I would do with this as Product Ops</h3>
                ${[
                  ["Ship self-serve wins first", "Prioritize clean developer/productivity/API-first apps with public docs and low access friction."],
                  ["Split outreach-heavy apps", "Route ads, fintech, enterprise, and admin-heavy apps into a partner or customer-admin motion."],
                  ["Protect the QA queue", "Keep low-confidence rows visible until access and buildability claims are manually resolved."]
                ].map(([title, copy], index) => `<div class="ops-item"><div class="num">${index + 1}</div><div><strong>${title}</strong><p class="muted">${copy}</p></div></div>`).join("")}
              </aside>
            </div>
          </section>
          <section class="section">
            <div class="section-head"><div><div class="eyebrow" style="color: var(--teal)">Landscape</div><h2>Buildability vs. access friction</h2></div><p>This 2x2 is the strategic view: not all public APIs are equally actionable, and not all buildable apps are self-serve.</p></div>
            ${landscape()}
          </section>
          ${workflowSection()}
          <section class="section">
            <div class="section-head"><div><div class="eyebrow" style="color: var(--teal)">Patterns</div><h2>The distribution tells the operating model.</h2></div><p>Simple charts keep the focus on decisions: what is buildable, what is gated, what blocks work, and which auth paths dominate.</p></div>
            <div class="chart-grid">
              ${chart("Buildability", analysis.buildability_distribution)}
              ${chart("Access model", analysis.access_model_distribution, "blue")}
              ${chart("Non-trivial blockers", nonNoneDistribution(analysis.blocker_counts), "amber")}
              ${chart("Primary auth", analysis.primary_auth_distribution, "violet")}
            </div>
          </section>
          ${queueSection(8)}
          ${verificationPreview()}
        `;
      }

      function landscape() {
        const q = landscapeCounts();
        return `<div class="landscape">
          ${quadrant("good", q.selfServeBuildable, "Build now + self-serve", "Low-friction candidates for implementation queue.", exampleApps((r) => r.buildability_verdict === "buildable_now" && r.access_model.startsWith("self_serve")))}
          ${quadrant("admin", q.adminBuildable, "Buildable + admin setup", "Technically viable, but customer/admin install path matters.", exampleApps((r) => r.buildability_verdict.includes("buildable") && r.access_model === "admin_or_workspace_dependent"))}
          ${quadrant("review", q.unclear, "Unclear / narrow / review", "Needs deeper source lookup or human review before roadmap decisions.", exampleApps((r) => r.confidence === "low" || r.buildability_verdict === "unclear_needs_review"))}
          ${quadrant("gated", q.gated, "Gated / outreach motion", "Potentially valuable, but access depends on approval, sales, or partner motion.", exampleApps((r) => r.access_model === "partner_or_contact_sales_gated" || r.buildability_verdict === "possible_but_gated"))}
        </div>`;
      }

      function quadrant(kind, count, title, copy, examples) {
        return `<div class="quadrant ${kind}"><div><div class="quadrant-count">${count}</div><h3>${title}</h3><p class="muted">${copy}</p></div><div class="chip-row">${examples.map((app) => `<span class="chip">${app}</span>`).join("")}</div></div>`;
      }

      function landscapeCounts() {
        return {
          selfServeBuildable: rows.filter((r) => r.buildability_verdict === "buildable_now" && r.access_model.startsWith("self_serve")).length,
          adminBuildable: rows.filter((r) => r.buildability_verdict.includes("buildable") && r.access_model === "admin_or_workspace_dependent").length,
          gated: rows.filter((r) => r.access_model === "partner_or_contact_sales_gated" || r.buildability_verdict === "possible_but_gated").length,
          unclear: rows.filter((r) => r.confidence === "low" || r.buildability_verdict === "unclear_needs_review").length
        };
      }

      function exampleApps(predicate) {
        return rows.filter(predicate).slice(0, 5).map((row) => row.app_name);
      }

      function nonNoneDistribution(distribution) {
        return Object.fromEntries(Object.entries(distribution || {}).filter(([key]) => key !== "none"));
      }

      function workflowSection() {
        const stages = [
          ["Bootstrap", "100 canonical app records", "app_records.stub.jsonl"],
          ["Discover", "official docs/API/auth/access/MCP sources", "app_records.discovered.jsonl"],
          ["Extract", "structured auth/access/API/buildability fields", "app_records.extracted.jsonl"],
          ["Verify", "sampled audit + QA queue", "verification_summary.json"],
          ["Analyze", "patterns, shortlists, category breakdowns", "analysis_summary.json"],
          ["Publish", "self-contained Vercel-ready microsite", "web/index.html"]
        ];
        return `<section class="section"><div class="section-head"><div><div class="eyebrow" style="color: var(--teal)">Agent workflow</div><h2>Six stages, six artifacts.</h2></div><p>The system is intentionally inspectable: every step writes an artifact that can be rerun and audited.</p></div><div class="timeline">${stages.map(([title, copy, artifact], index) => `<div class="stage"><div class="num">${index + 1}</div><h3>${title}</h3><p class="muted">${copy}</p><code>${artifact}</code></div>`).join("")}</div></section>`;
      }

      function queueSection(limit = 10) {
        return `<section class="section"><div class="section-head"><div><div class="eyebrow" style="color: var(--teal)">Decision queues</div><h2>Build next vs. needs outreach.</h2></div><p>These lists turn the research into a prioritization artifact, not just a table.</p></div><div class="queue-grid">${queue("Build next", analysis.easy_wins.slice(0, limit), "green")}${queue("Needs outreach", analysis.outreach_needed.slice(0, limit), "amber")}</div></section>`;
      }

      function queue(title, items, tone) {
        return `<div class="queue"><h3>${title}</h3><div class="queue-list">${items.map((item) => `<div class="queue-row"><div class="rank">${item.rank}</div><div><strong>${item.app_name}</strong><p class="muted">${item.category} · ${titleize(item.access_model)} · ${titleize(item.api_breadth)}</p></div><span class="badge ${tone}">${titleize(item.main_blocker)}</span></div>`).join("")}</div></div>`;
      }

      function verificationPreview() {
        return `<section class="section"><div class="section-head"><div><div class="eyebrow" style="color: var(--teal)">Trust layer</div><h2>The verifier was conservative on purpose.</h2></div><p>Low strict accuracy is not hidden; it is used to show where automation needs better evidence or human review.</p></div><div class="metric-grid">
          ${metric(verification.sample_size, "sampled apps")}
          ${metric("120", "field-level checks")}
          ${metric(fmtPct(verification.first_pass_accuracy * 100), "strict field accuracy")}
          ${metric(fmtPct(verification.unresolved_after_verification_rate * 100), "unresolved after auto-verification")}
        </div><div style="margin-top:18px"><a class="button primary" href="${link("verification/")}">Open verification audit</a></div></section>`;
      }

      function agentsPage() {
        app.innerHTML = `
          ${hero({
            eyebrow: "Agent architecture",
            title: "Six agents, one research contract.",
            copy: "The system is shaped like a small research operating system: each agent has a narrow job, structured inputs, structured outputs, and a visible failure mode.",
            primary: { href: link("dataset/"), label: "View output dataset" },
            secondary: { href: link("index.html"), label: "Back to overview" }
          })}
          <section class="section">
            <div class="section-head"><div><div class="eyebrow" style="color: var(--teal)">Agents</div><h2>What each agent does</h2></div><p>These are implemented as deterministic pipeline modules today, with clear seams for LLM/browser-assisted upgrades.</p></div>
            <div class="agent-grid">${agentCards().join("")}</div>
          </section>
          <section class="section">
            <div class="section-head"><div><h2>Agent contract syntax</h2></div><p>The key design decision was not a giant prompt. It was a series of small contracts that produce auditable artifacts.</p></div>
            <pre class="code">agent := {
  input: "previous artifact",
  task: "one narrow transformation",
  output: "validated JSONL / JSON / CSV",
  failure_mode: "flag uncertainty instead of hiding it",
  human_review: "only where evidence or access is ambiguous"
}</pre>
          </section>
          ${workflowSection()}
        `;
      }

      function agentCards() {
        return [
          ["Bootstrap Agent", "Creates canonical records for the 100-app set.", "data/input/apps.csv", "data/processed/app_records.stub.jsonl", "python3 -m src.bootstrap_records"],
          ["Discovery Agent", "Attaches official docs, auth, API, access, and MCP sources.", "app_records.stub.jsonl", "app_records.discovered.jsonl", "python3 -m src.discover_sources"],
          ["Extraction Agent", "Applies the rubric to fill auth, access, API, MCP, buildability, and evidence fields.", "app_records.discovered.jsonl", "app_records.extracted.jsonl", "python3 -m src.extract_record"],
          ["Verification Agent", "Runs sanity checks and a sampled field-level audit.", "app_records.extracted.jsonl", "verification_summary.json", "python3 -m src.verify_record"],
          ["Analysis Agent", "Computes distributions, category patterns, easy wins, and outreach queues.", "app_records.verified.jsonl", "analysis_summary.json", "python3 -m src.run_analysis"],
          ["Publishing Agent", "Embeds outputs into a static microsite for Vercel deployment.", "analysis + final data", "web/*.html", "python3 -m src.build_case_study"]
        ].map(([name, role, input, output, command]) => `<article class="agent"><div class="agent-top"><div><h3>${name}</h3><p>${role}</p></div><span class="badge dark">agent</span></div><div class="chip-row"><span class="chip">input: ${input}</span><span class="chip">output: ${output}</span></div><code class="code">${command}</code></article>`);
      }

      function datasetPage() {
        app.innerHTML = `
          ${hero({
            eyebrow: "Dataset explorer",
            title: "The 100-app research matrix.",
            copy: "Search and filter the reviewer-facing dataset by category, access model, buildability, confidence, and evidence. This page is the data room behind the case study.",
            primary: { href: "#matrix", label: "Jump to matrix" },
            secondary: { href: link("index.html"), label: "Back to overview" }
          })}
          <section class="section">
            <div class="section-head"><div><h2>Dataset snapshot</h2></div><p>Flattened from the verified records for review and export.</p></div>
            <div class="metric-grid">
              ${metric(rows.length, "apps in matrix")}
              ${metric(analysis.dataset_summary.with_evidence, "rows with evidence")}
              ${metric(analysis.dataset_summary.with_public_api, "rows with public API")}
              ${metric(analysis.dataset_summary.low_confidence_rows, "low-confidence rows")}
            </div>
          </section>
          ${tableSection()}
        `;
        setupTable();
      }

      function verificationPage() {
        app.innerHTML = `
          ${hero({
            eyebrow: "Verification audit",
            title: "The trust layer is deliberately strict.",
            copy: "The audit does not exist to make the agent look perfect. It exists to reveal which fields are reliable, which are partial, and which require human review before roadmap decisions.",
            primary: { href: link("dataset/"), label: "Inspect dataset" },
            secondary: { href: link("agents/"), label: "See agent system" }
          })}
          <section class="section">
            <div class="section-head"><div><h2>Audit metrics</h2></div><p>Sampled verification measured strict correctness and unresolved evidence, not just whether the pipeline produced a row.</p></div>
            <div class="metric-grid">
              ${metric(verification.sample_size, "sampled apps")}
              ${metric("120", "field-level checks")}
              ${metric(fmtPct(verification.first_pass_accuracy * 100), "strict first-pass accuracy")}
              ${metric(fmtPct(verification.first_pass_correct_or_partial_rate * 100), "correct-or-partial")}
              ${metric(fmtPct(verification.unresolved_after_verification_rate * 100), "unresolved after auto-verification")}
              ${metric(verification.row_outcomes.flagged || 0, "flagged rows")}
              ${metric(verification.row_outcomes.corrected || 0, "corrected rows")}
              ${metric(verification.row_outcomes.partial || 0, "partial rows")}
            </div>
          </section>
          <section class="section">
            <div class="section-head"><div><h2>What broke</h2></div><p>The useful failures were concentrated in access, buildability, and source ambiguity.</p></div>
            <div class="chart-grid">
              ${chart("Field-level labels", aggregateFieldLabels(verification.field_accuracy), "blue")}
              ${chart("Row outcomes", objectToDistribution(verification.row_outcomes), "amber")}
            </div>
          </section>
          <section class="section">
            <div class="section-head"><div><h2>Representative audit rows</h2></div><p>Examples from the sampled verification checks. The unresolved rows are intentionally visible.</p></div>
            ${verificationTable()}
          </section>
        `;
      }

      function aggregateFieldLabels(fieldAccuracy) {
        const counts = {};
        Object.values(fieldAccuracy || {}).forEach((field) => Object.entries(field).forEach(([label, count]) => counts[label] = (counts[label] || 0) + count));
        return objectToDistribution(counts);
      }

      function objectToDistribution(obj) {
        const total = Object.values(obj || {}).reduce((sum, count) => sum + count, 0) || 1;
        return Object.fromEntries(Object.entries(obj || {}).map(([key, count]) => [key, { count, pct: (count / total) * 100 }]));
      }

      function verificationTable() {
        const checks = verification.checks.slice(0, 8).flatMap((check) => check.fields_checked.filter((field) => field.issue_found).slice(0, 2).map((field) => ({ check, field }))).slice(0, 10);
        return `<div class="table-shell"><div class="table-wrap"><table><thead><tr><th>App</th><th>Field</th><th>First pass</th><th>Audit finding</th><th>Status</th></tr></thead><tbody>${checks.map(({ check, field }) => `<tr><td><strong>${check.app_name}</strong></td><td>${field.field}</td><td>${field.extracted_value}</td><td>${field.issue_found}</td><td><span class="badge ${badgeClass(field.initial_result)}">${titleize(field.initial_result)}</span></td></tr>`).join("")}</tbody></table></div></div>`;
      }

      function tableSection() {
        return `<section id="matrix" class="section"><div class="section-head"><div><h2>100-app matrix</h2></div><p>Evidence links open in a new tab. Internal filters stay on this page.</p></div><div class="table-shell"><div class="filters"><input id="search" type="search" placeholder="Search app, blocker, notes..." /><select id="category"><option value="">All categories</option></select><select id="verdict"><option value="">All verdicts</option></select><select id="access"><option value="">All access models</option></select><select id="confidence"><option value="">All confidence</option></select></div><div class="table-wrap"><table><thead><tr><th>App</th><th>Category</th><th>Description</th><th>Auth</th><th>Access</th><th>API</th><th>MCP</th><th>Verdict</th><th>Blocker</th><th>Confidence</th><th>Evidence</th></tr></thead><tbody id="tableBody"></tbody></table></div></div></section>`;
      }

      function setupTable() {
        fillSelect("#category", [...new Set(rows.map((row) => row.category))]);
        fillSelect("#verdict", [...new Set(rows.map((row) => row.buildability_verdict))]);
        fillSelect("#access", [...new Set(rows.map((row) => row.access_model))]);
        fillSelect("#confidence", [...new Set(rows.map((row) => row.confidence))]);
        renderTable(rows);
        ["#search", "#category", "#verdict", "#access", "#confidence"].forEach((selector) => {
          document.querySelector(selector).addEventListener("input", filterTable);
          document.querySelector(selector).addEventListener("change", filterTable);
        });
      }

      function fillSelect(selector, values) {
        const select = document.querySelector(selector);
        values.sort().forEach((value) => select.insertAdjacentHTML("beforeend", `<option value="${value}">${titleize(value)}</option>`));
      }

      function filterTable() {
        const query = document.querySelector("#search").value.toLowerCase().trim();
        const category = document.querySelector("#category").value;
        const verdict = document.querySelector("#verdict").value;
        const access = document.querySelector("#access").value;
        const confidence = document.querySelector("#confidence").value;
        renderTable(rows.filter((row) => {
          const text = Object.values(row).join(" ").toLowerCase();
          return (!query || text.includes(query)) && (!category || row.category === category) && (!verdict || row.buildability_verdict === verdict) && (!access || row.access_model === access) && (!confidence || row.confidence === confidence);
        }));
      }

      function renderTable(data) {
        document.querySelector("#tableBody").innerHTML = data.map((row) => `<tr><td><strong>${row.app_name}</strong></td><td>${row.category}</td><td>${row.what_it_does}</td><td>${row.auth_methods}</td><td>${titleize(row.access_model)}</td><td>${row.public_api}; ${titleize(row.api_breadth)}<br><span class="muted">${row.api_protocols}</span></td><td>${titleize(row.mcp_status)}</td><td><span class="badge ${badgeClass(row.buildability_verdict)}">${titleize(row.buildability_verdict)}</span></td><td>${titleize(row.main_blocker)}</td><td><span class="badge ${badgeClass(row.confidence)}">${titleize(row.confidence)}</span></td><td>${evidenceLinks(row)}</td></tr>`).join("");
      }

      function evidenceLinks(row) {
        const links = [["docs", row.developer_docs_url], ["api", row.api_docs_url], ["auth", row.auth_docs_url], ["access", row.pricing_or_access_url]].filter(([, url]) => url);
        return links.length ? links.map(([label, url]) => `<a href="${url}" target="_blank" rel="noreferrer">${label}</a>`).join(" · ") : "missing";
      }

      if (PAGE === "overview") overviewPage();
      if (PAGE === "agents") agentsPage();
      if (PAGE === "dataset") datasetPage();
      if (PAGE === "verification") verificationPage();
    </script>
  </body>
</html>
